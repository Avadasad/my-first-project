  --sky-a-rain:#1a2c3d;
  --sky-b-rain:#33495c;
  --sky-a-dusk:#3b2a5c;
  --sky-b-dusk:#c4684a;

  --sky-b-night:#1b2748;

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-body);
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.app{height:100%;width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lvl{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1}
.lvl small{font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.deaths{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.deaths b{font-family:var(--font-display);font-size:22px;color:var(--accent);font-weight:700}
.stage{position:relative;flex:1;min-height:0}
#game{position:absolute;left:50%;top:0;transform:translateX(-50%);display:block;border-radius:10px;touch-action:none;background:var(--sky);box-shadow:0 0 0 1px var(--panel),0 12px 30px rgba(0,0,0,.4)}
@media (orientation:landscape){#game{top:50%;transform:translate(-50%,-50%)}}
.cap{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;padding:6px 14px;border-radius:8px;background:var(--scrim);font-family:var(--font-display);font-weight:500;font-size:18px;text-align:center;max-width:100%;width:max-content;font-size:16px;line-height:1.25;text-wrap:balance;pointer-events:none;transition:opacity .4s}
.cap.off{opacity:0}
.cap.narr{background:var(--accent);color:var(--on-accent);font-family:var(--font-body);font-weight:700;font-style:italic;font-size:15px}
.right{display:flex;align-items:center;gap:12px}
.mute{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:var(--panel);color:var(--ink);padding:0}
.mute svg{width:22px;height:22px;fill:currentColor}
.mute .x{display:none}
.mute.off .wave{display:none}
.mute.off .x{display:inline}
.pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.pad-l{display:flex;gap:14px}
.pb{pointer-events:auto;width:76px;height:76px;display:grid;place-items:center;border:0;border-radius:20px;background:var(--pad-bg);color:var(--ink);touch-action:none;padding:0}
.pb svg{width:34px;height:34px;fill:currentColor}
.pb.on{background:var(--accent);color:var(--on-accent)}
.pb-j{width:96px;height:96px;border-radius:26px}
@media (orientation:landscape) and (max-height:560px){.pb{width:64px;height:64px}.pb-j{width:80px;height:80px}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim);z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none}
@font-face{font-family:"NumFont";src:local("Helvetica Neue"),local("Helvetica"),local("Arial"),local("Roboto"),local("Segoe UI"),local("Liberation Sans"),local("DejaVu Sans");unicode-range:U+0030-0039;font-weight:100 900}
.lvl span,.deaths b{font-family:var(--font-body);font-weight:700;font-variant-numeric:tabular-nums}
html,body{overscroll-behavior:none;touch-action:none}
.pad{padding:0 10px 12px}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--sky-line);border-radius:14px;padding:20px;display:grid;gap:12px}
.card h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;text-wrap:balance}
.card p{margin:0;color:var(--muted);text-wrap:pretty}
.primary{width:100%;min-height:54px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-family:var(--font-display);font-weight:700;font-size:21px}
.top{flex-wrap:nowrap}.lvl,.deaths{white-space:nowrap}
.rot{display:none}
@media (max-width:520px){
  .lvl{font-size:17px}.lvl small{font-size:10px;margin-right:5px}
  .deaths{font-size:12px}.deaths b{font-size:18px}
  .right{gap:6px}.mute{width:34px;height:34px}
}
@media (orientation:portrait){
  body{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  .rot{display:block;position:absolute;left:0;right:0;top:42%;text-align:center;color:var(--muted);font-size:14px;padding:0 24px;pointer-events:none}
}
</style>

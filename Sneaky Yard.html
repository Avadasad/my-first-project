/* Layout: one-screen platformer. Slim header (level, deaths), 16:9 playfield, big thumb buttons at the bottom of the stage (overlaid in landscape). */

  --bg:#0e2a30;

  --sky-line:#205861;
  --soil:#6b4f3a;
  --soil-dark:#543d2c;
  --grass:#79b35b;
  --spike:#f4efe4;
  --bone:#f2ead3;
  --cat:#8d98a8;
  --cat-dark:#586174;
  --water:#7fd0ff;
  --mail:#3f6fb6;
  --mail-dark:#274a80;
  --vac:#e3b340;
  --vac-dark:#6b5a2a;
  --leaf:#4f9a4b;
  --trunk:#6b4a2f;
  --squirrel:#c47a3b;
  --bird:#9aa7b8;
  --spike-shade:#c4bca7;
  --dog:#d8a468;
  --dog-dark:#8a5a34;
  --door:#b5472f;
  --door-roof:#e8a14a;
  --scrim:rgba(6,20,24,.78);
  --pad-bg:rgba(22,57,63,.82);
  --font-display:"Pixelify Sans","Courier New",monospace;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

 {cap:'Clean sweep.',rows:[WALL,E,E,E,E,'#...b.......b..#','#P....s....v..D#',WALL,WALL]},
 {cap:'Free shower.',rows:[WALL,E,'#.......b......#','#............D.#','#..........#####',E,'#P...o...w.....#',WALL,WALL]},

 {cap:'SQUIRREL!',rows:[WALL,E,E,E,E,'#.......q......#','#P...s.....b..D#','#######ff#######','#######^^#######']},

];

function parse(rows){
  var L={w:GW,h:GH,tiles:[],cellTrap:[],traps:[],start:null,door:null,target:null};
  for(var y=0;y<GH;y++){
    var tr=[],ct=[];
    for(var x=0;x<GW;x++){
      var c=rows[y].charAt(x),t='.';ct.push(-1);

      else if(c==='^')t='^';

      else if(c==='D')L.door={x:x,y:y};
      else if(c==='n')L.target={x:x,y:y};
      else if('sfkXbocmvwZqB'.indexOf(c)>=0){L.traps.push({type:c,x:x,y:y});ct[x]=L.traps.length-1;}
      tr.push(t);
    }

  }
  for(var q=0;q<L.traps.length;q++)if(L.traps[q].type==='Z')L.leash={sx:L.start.x+0.5,len:7.2};
  return L;
}
function newState(L){
  var G={bones:0,cause:'',cut:false,ev:[],rec:false,L:L,p:{x:L.start.x+(1-PW)/2,y:L.start.y+1-PH,vx:0,vy:0,ground:false,coy:0,face:1,tight:false,dist:0},tr:[],door:{x:L.door.x,y:L.door.y,moved:false},dead:false,won:false,t:0};

  return G;
}
function clone(G){
  return {bones:G.bones,cause:G.cause,cut:G.cut,ev:[],rec:false,L:G.L,p:{x:G.p.x,y:G.p.y,vx:G.p.vx,vy:G.p.vy,ground:G.p.ground,coy:G.p.coy,face:G.p.face,tight:G.p.tight,dist:G.p.dist},
    tr:G.tr.map(function(a){return {s:a.s,tm:a.tm,y:a.y,vy:a.vy,x:a.x,dir:a.dir,hold:a.hold};}),
    door:{x:G.door.x,y:G.door.y,moved:G.door.moved},dead:G.dead,won:G.won,t:G.t};

function emit(G,n){if(G.rec)G.ev.push(n);}
function solid(G,cx,cy){
  var L=G.L;
  if(cx<0||cx>=L.w||cy<0)return true;
  if(cy>=L.h)return false;
  if(L.tiles[cy][cx]==='#')return true;
  var ti=L.cellTrap[cy][cx];
  if(ti>=0&&L.traps[ti].type==='f'&&G.tr[ti].s<2)return true;
  return false;
}
function moveX(G,dx){
  var p=G.p;p.x+=dx;
  var top=Math.floor(p.y+0.001),bot=Math.floor(p.y+PH-0.001),y,cx;
  if(dx>0){cx=Math.floor(p.x+PW);for(y=top;y<=bot;y++)if(solid(G,cx,y)){p.x=cx-PW-0.0001;break;}}
  else if(dx<0){cx=Math.floor(p.x);for(y=top;y<=bot;y++)if(solid(G,cx,y)){p.x=cx+1+0.0001;break;}}
}
function moveY(G,dy){
  var p=G.p;p.y+=dy;
  var l=Math.floor(p.x+0.001),r=Math.floor(p.x+PW-0.001),x,cy;
  if(dy>0){cy=Math.floor(p.y+PH);for(x=l;x<=r;x++)if(solid(G,x,cy)){p.y=cy-PH-0.0001;p.vy=0;p.ground=true;break;}}
  else if(dy<0){cy=Math.floor(p.y);for(x=l;x<=r;x++)if(solid(G,x,cy)){p.y=cy+1+0.0001;p.vy=0;break;}}
}

  var L=G.L,p=G.p,pcx=p.x+PW/2,pcy=p.y+PH/2;
  for(var i=0;i<L.traps.length;i++){

      else if(t.s===1){t.tm-=DT;if(t.tm<=0)t.s=2;}
    }else if(tp.type==='k'){
      if(t.s===0){if(Math.abs(pcx-cx)<=3.3&&pcy>cy){t.s=1;t.y=tp.y;t.vy=0;}}
      else if(t.s===1){

        var by=Math.floor(t.y+1);
        if(solid(G,tp.x,by)){t.y=by-1;t.s=2;}

    }else if(tp.type==='B'){
      t.tm=(t.tm+DT)%8;
      var bfly=t.tm<6;
      t.x=bfly?17-3*t.tm:-5;
      if(!bfly){t.hold=0;t.vy=0;}
      else{
        var bby=tp.y+0.5;
        for(var bj=0;bj<L.traps.length;bj++){

          if(bt.type==='b'&&bs.s===0&&Math.abs(t.x-(bt.x+0.5))<0.55&&Math.abs(bby-(bt.y+0.5))<0.7){bs.s=2;t.hold=1;emit(G,'steal:'+bj);}
        }
        if(t.vy>0)t.vy-=DT;
        else if(Math.abs(t.x-pcx)<0.4&&pcy>bby){emit(G,'poop:'+i);t.vy=3;}
      }
    }
  }
  if(L.target&&!G.door.moved&&Math.abs(pcx-(G.door.x+0.5))<=2.3){G.door.x=L.target.x;G.door.y=L.target.y;G.door.moved=true;}
}
function deathCause(G){
  var L=G.L,p=G.p;
  var l=p.x+0.06,r=p.x+PW-0.06,t=p.y+0.06,b=p.y+PH-0.04;

    if(tp.type==='X'&&hit(tp.x+0.1,tp.y+0.05,tp.x+0.9,tp.y+1))return 'fake';
    if(tp.type==='k'&&s.s<3&&hit(tp.x+0.2,s.y+0.1,tp.x+0.8,s.y+0.9))return 'fall';
    if(tp.type==='o'&&hit(tp.x+0.15,tp.y+0.25,tp.x+0.85,tp.y+0.9))return 'bone';
    if(tp.type==='c'&&hit(s.x-0.3,tp.y+0.4,s.x+0.3,tp.y+1))return 'cat';
    if(tp.type==='m'&&hit(s.x-0.36,tp.y-0.3,s.x+0.36,tp.y+1))return 'mail';

function pickBones(G){
  var L=G.L,p=G.p;
  for(var i=0;i<L.traps.length;i++){
    var tp=L.traps[i],s=G.tr[i];
    if(tp.type==='b'&&s.s===0&&p.x+PW>tp.x+0.15&&p.x<tp.x+0.85&&p.y+PH>tp.y+0.2&&p.y<tp.y+0.9){s.s=1;G.bones++;emit(G,'bone');}
    if(tp.type==='Z'&&s.s===0&&p.x+PW>tp.x+0.1&&p.x<tp.x+0.9&&p.y+PH>tp.y+0.2&&p.y<tp.y+1){s.s=1;G.cut=true;emit(G,'snip');}
  }
}
function step(G,inp){
  if(G.dead||G.won)return;
  var p=G.p;G.t+=DT;

  p.vx=dir*SPEED;
  if(inp.j&&(p.ground||p.coy>0)){p.vy=-JUMP;p.ground=false;p.coy=0;emit(G,'jump');}

function drawMailman(cx,ty,dir,paused,T,t){

function drawVac(cx,ty,dir,active,T,t){

function drawSprinkler(tp,s,T,t){

function drawTree(tp,s,T,t){
  var cx=(tp.x+0.5)*T,cy=(tp.y+0.5)*T,gr=tp.y+1;

  ctx.fillStyle=K.trunk;ctx.fillRect(cx-T*0.1,cy,T*0.2,gr*T-cy);

function drawBird(tp,s,T,t){
  if(s.x<-1||s.x>17)return;
  var X=s.x*T,Y=(tp.y+0.5)*T,fl=Math.sin(t*16)*T*0.14;
  ctx.fillStyle=K.bird;rr(X-T*0.2,Y-T*0.1,T*0.4,T*0.22,T*0.1);ctx.fill();

function drawHouse(x,y,T,fake,t){
  var X=x*T,Y=y*T;
  ctx.fillStyle=K.door;ctx.fillRect(X+T*0.14,Y+T*0.38,T*0.72,T*0.62);

  ctx.fillStyle=K.bg;rr(X+T*0.34,Y+T*0.56,T*0.32,T*0.44,T*0.16);ctx.fill();ctx.fillRect(X+T*0.34,Y+T*0.8,T*0.32,T*0.2);

function drawDog(t){
  var T=cw/GW,p=G.p,s=PW*T,x=p.x*T,y=p.y*T,f=p.face;

function drawLeash(T){

function draw(t){
  var T=cw/GW,x,y,i;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=K.sky;ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle=K['sky-line'];
  for(x=1;x<GW;x++)ctx.fillRect(x*T-1,0,2,ch);
  var ox=0,oy=0;
  if(shake>0.02){ox=(Math.random()-0.5)*shake*8;oy=(Math.random()-0.5)*shake*8;}
  shake*=0.88;
  ctx.save();ctx.translate(ox,oy);
  var L=Lcur;
  for(y=0;y<GH;y++)for(x=0;x<GW;x++){
    var c=L.tiles[y][x];
    if(c==='#'){
      var above=y>0&&L.tiles[y-1][x]==='#';
      var ti0=y>0?L.cellTrap[y-1][x]:-1;
      if(ti0>=0&&L.traps[ti0].type==='f')above=true;
      drawGround(x,y,T,!above,y>=GH-1);
    }else if(c==='^')drawSpikesUp(x,y,T,1);
  }
  for(i=0;i<L.traps.length;i++){
    var tp=L.traps[i],s=G.tr[i];

        var aboveF=tp.y>0&&L.tiles[tp.y-1][tp.x]==='#';

        if(s.s===1&&!calm)ctx.translate((Math.random()-0.5)*T*0.06,(Math.random()-0.5)*T*0.04);

        ctx.restore();
      }

      if(s.s===1)drawSpikesUp(tp.x,tp.y,T,Math.max(0.15,s.tm));
    }else if(tp.type==='k'){
      if(s.s<3)drawSpikesDown(tp.x,s.y,T);
    }else if(tp.type==='X'){
      drawHouse(tp.x,tp.y,T,true,t);
    }else if(tp.type==='b'){
      if(s.s===0)drawBone(tp.x,tp.y,T,t);
    }else if(tp.type==='o'){
      drawBone(tp.x,tp.y,T,t);
    }else if(tp.type==='c'){
      drawCat(s.x,tp.y,s.dir,T,t);
    }else if(tp.type==='m'){
      drawMailman(s.x,tp.y,s.dir,s.tm>0,T,t);
    }else if(tp.type==='v'){
      drawVac(s.x,tp.y,s.dir,s.s===1,T,t);

  }

  }

}

function resize(){
  var r=stage.getBoundingClientRect(),aw=r.width,ah=r.height;
  if(!aw||!ah){aw=640;ah=360;}
  var w=Math.floor(Math.min(aw,ah*GW/GH)),h=w*GH/GW;
  dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  cw=w;ch=h;
  var cap=$('cap');
  if(window.matchMedia&&matchMedia('(orientation:landscape)').matches){cap.style.top=Math.max(0,(ah-h)/2+8)+'px';}
  else cap.style.top=(h+10)+'px';
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);

var PADS=[['bl','l'],['br','r'],['bj','j']].map(function(a){return {el:$(a[0]),key:a[1]};});
var src={t:{l:0,r:0,j:0},m:{l:0,r:0,j:0},k:{l:0,r:0,j:0}};
function recompute(){
  ['l','r','j'].forEach(function(key){inp[key]=!!(src.t[key]||src.m[key]||src.k[key]);});
  PADS.forEach(function(p){p.el.classList.toggle('on',inp[p.key]);});
  idleFrames=0;
}
function touchUpdate(list){
  var on={l:0,r:0,j:0};
  for(var i=0;i<list.length;i++){
    var tx=list[i].clientX,ty=list[i].clientY;
    for(var k=0;k<PADS.length;k++){
      var r=PADS[k].el.getBoundingClientRect(),m=16;
      if(tx>=r.left-m&&tx<=r.right+m&&ty>=r.top-m&&ty<=r.bottom+m)on[PADS[k].key]=1;
    }
  }
  src.t=on;recompute();
}
function onTouch(e){
  var onMute=e.target&&e.target.closest&&e.target.closest('#mute');
  if(!sheetOpen&&!onMute&&e.cancelable!==false)e.preventDefault();
  touchUpdate(e.touches||[]);
}
window.addEventListener('touchstart',onTouch,{passive:false});
window.addEventListener('touchmove',onTouch,{passive:false});
window.addEventListener('touchend',onTouch,{passive:false});
window.addEventListener('touchcancel',onTouch,{passive:false});
PADS.forEach(function(p){
  p.el.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;src.m[p.key]=1;recompute();});
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    p.el.addEventListener(ev,function(e){if(e.pointerType!=='mouse')return;src.m[p.key]=0;recompute();});
  });
});
var KEYMAP={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j'};
window.addEventListener('keydown',function(e){var k=KEYMAP[e.key];if(!k)return;e.preventDefault();src.k[k]=1;recompute();});
window.addEventListener('keyup',function(e){var k=KEYMAP[e.key];if(!k)return;src.k[k]=0;recompute();});
window.addEventListener('blur',function(){src.t={l:0,r:0,j:0};src.m={l:0,r:0,j:0};src.k={l:0,r:0,j:0};recompute();});

/* ---------- start ---------- */
loadLevel(lvlIndex,false);
resize();
requestAnimationFrame(frame);
showSheet('Sneaky Yard','Reach the doghouse. Bones are tasty, but some bite back. Dying is normal here, the counter keeps score.',lvlIndex>0?'Continue':'Play',function(){hideSheet();showCap(LEVELS[lvlIndex].cap,3000);});
})();
